    // --- THEME TOGGLE (LIGHT / DARK) ---
    let currentTheme = 'light';

    function initTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      currentTheme = isDark ? 'dark' : 'light';
      updateThemeUI();
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        currentTheme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        currentTheme = 'dark';
      }
      updateThemeUI();
      playSound('click');
    }

    function updateThemeUI() {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (currentTheme === 'light') {
        if (icon) icon.innerText = '☀️';
        if (label) label.innerText = 'สว่าง';
      } else {
        if (icon) icon.innerText = '🌙';
        if (label) label.innerText = 'มืด';
      }
    }

    // --- AUDIO SYNTH ENGINE ---
    let audioCtx = null;
    let isMuted = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleAudio() {
      isMuted = !isMuted;
      const btn = document.getElementById('btnAudioToggle');
      if (btn) btn.innerText = isMuted ? '🔇 เสียง: ปิด' : '🔊 เสียง: เปิด';
      if (!isMuted) playSound('click');
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(880, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'select') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.12);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.08);
          osc.frequency.setValueAtTime(659.25, now + 0.16);
          osc.frequency.setValueAtTime(880, now + 0.24);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'warning') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(180, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

                ${sceneSvg}
                ${toastHtml}

                <div class="absolute bottom-2.5 right-2.5 bg-slate-950/80 border border-slate-800 px-2 py-0.5 rounded text-[10px] text-slate-300 font-mono">
                  ${gameState.company ? gameState.company.badge : 'Tech Company'}
                </div>
              </div>

              <!-- 16-Week Milestone Track -->
              <div class="mt-3 bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800/80 rounded-lg p-3 font-mono">
                <div class="flex items-center justify-between text-xs text-slate-600 dark:text-slate-400 mb-1.5">
                  <span class="font-bold">ความคืบหน้าสหกิจศึกษา</span>
                  <span class="text-amber-600 dark:text-amber-400 font-bold">สัปดาห์ที่ ${gameState.week} / 16</span>
                </div>
                <div class="relative w-full h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-amber-500 to-emerald-500 rounded-full transition-all duration-300" style="width: ${(gameState.week / TOTAL_WEEKS) * 100}%"></div>
                </div>
                <div class="flex justify-between text-[10px] text-slate-400 dark:text-slate-500 mt-1.5">
                  <span>W1 เริ่มต้น</span>
                  <span>W4 มิดเทอม</span>
                  <span>W8 สรุปงาน</span>
                  <span>W12 พรีเซนต์</span>
                  <span>W16 บรรจุ</span>
                </div>
              </div>
            </div>

            <!-- Bottom Left Info Bar -->
            <div class="mt-3 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 font-mono pt-2 border-t border-slate-200 dark:border-slate-800">
              <span>บริษัท: <strong class="text-slate-800 dark:text-slate-200">${gameState.company ? gameState.company.name : 'Tech Corp'}</strong></span>
              <span class="text-emerald-700 dark:text-emerald-400 font-bold">เบี้ยเลี้ยงสะสม: ฿${gameState.stats.money.toLocaleString()}</span>
            </div>
          </div>

          <!-- RIGHT COLUMN: Story Narrative & 3 Compact Choice Cards -->
          <div class="lg:col-span-6 flex flex-col justify-between space-y-3">
            
            <div>
              <div class="flex items-center gap-2 text-xs font-mono text-amber-700 dark:text-amber-400 mb-1">
                <span>สถานการณ์สหกิจศึกษา</span>
                <span>·</span>
                <span>สัปดาห์ที่ ${gameState.week} / 16</span>
                <span>·</span>
                <span class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-1.5 py-0.2 rounded font-bold">${roleObj.badge}</span>
              </div>

              <!-- Context Box (High Contrast Warm Cream in Light Mode) -->
              <div class="border-l-4 border-amber-500 bg-amber-50/70 dark:bg-slate-900/80 p-3 rounded-r text-xs sm:text-sm text-slate-800 dark:text-slate-200 leading-relaxed font-medium">
                ${ev.intro}
              </div>

              <!-- Question Title -->
              <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white mt-2.5 leading-snug">
                ${ev.title}
              </h2>
            </div>

            <!-- Choice Cards vs Feedback State -->
            ${gameState.screen === 'event' ? `
              <!-- 3 Interactive Choice Cards (Crisp Light Cards with High Contrast) -->
              <div class="space-y-2">
                ${choices.map((c, idx) => `
                  <button onclick="makeChoice(${idx})" class="w-full text-left p-3 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/90 hover:border-amber-500 hover:bg-amber-50/60 dark:hover:bg-slate-800 transition flex items-start gap-3 shadow-xs group">
                    <span class="w-6 h-6 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 group-hover:bg-amber-500 group-hover:text-black font-mono font-bold text-xs flex items-center justify-center shrink-0 border border-slate-300 dark:border-slate-700 transition">
                      ${idx + 1}
                    </span>
                    <div class="flex-1">
                      <div class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-slate-100 group-hover:text-amber-900 dark:group-hover:text-amber-200 transition">
                        ${c.text}
                      </div>
                      <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 font-mono">
                        ${c.hint}
                      </div>
                    </div>
                  </button>
                `).join('')}
              </div>

              <div class="text-[11px] text-slate-500 dark:text-slate-400 font-mono text-center sm:text-left">
                กดตัวเลข 1, 2, หรือ 3 บนแป้นพิมพ์เพื่อเลือก
              </div>
            ` : `
              <!-- Feedback State -->
              <div class="bg-emerald-50 dark:bg-slate-900/90 border-2 border-emerald-500/60 p-4 rounded-xl space-y-3 shadow-sm">
                <div class="flex items-center gap-2 text-emerald-800 dark:text-emerald-400 font-bold text-sm">
                  <span>✔ ผลลัพธ์การตัดสินใจ:</span>
                </div>
                <p class="text-xs sm:text-sm text-slate-800 dark:text-slate-200 leading-relaxed font-medium">
                  ${gameState.lastFeedback || 'คุณผ่านสัปดาห์นี้ไปได้อย่างราบรื่น'}
                </p>
                <div class="pt-1">
                  <button onclick="nextWeek()" class="w-full py-3 gold-btn rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-md">
                    <span>${gameState.week >= TOTAL_WEEKS ? 'ดูผลการประเมินจบการฝึกงาน (กด Enter)' : 'ไปต่อสัปดาห์ถัดไป (กด Enter)'}</span>
                    <span class="font-mono text-xs opacity-80">↵</span>
                  </button>
                </div>
              </div>
            `}

          </div>
        </div>
      `;
    }

    // 3. ENDING SCREEN
    function renderEndingScreen(container) {
      const s = gameState.stats;
      const roleObj = ROLES[gameState.selectedRole] || ROLES.dev;
      const comp = gameState.company || COMPANIES[0];

      let title = "บัณฑิตจบใหม่เกียรตินิยม Return Offer การันตี!";
      let badge = "🏆 S-TIER RETURN OFFER";
      let desc = "ผลงานตลอด 16 สัปดาห์ของคุณโดดเด่นจนบอร์ดบริหารและ Tech Lead อนุมัติสัญญาจ้างพนักงานประจำทันที พร้อมเงินเดือนเริ่มต้นระดับท็อปของรุ่น!";
      let toneColor = "text-amber-600 dark:text-amber-400";

      if (s.energy <= 0 || s.sanity <= 0) {
        title = "Burnout ล้มป่วยก่อนจบโครงการ";
        badge = "💀 BURNOUT RETREAT";
        desc = "คุณโหมงานหนักและแบกรับความกดดันจนร่างกายประท้วง ต้องพักรักษาตัว แม้จะเก่งแต่สุขภาพต้องมาก่อน ขอให้พักผ่อนเต็มที่เพื่อกลับมาใหม่!";
        toneColor = "text-red-600 dark:text-red-400";
      } else if (s.skill >= 75 && s.karma >= 60) {
        title = "ว่าที่ Tech Lead ดาวรุ่งคนใหม่";
        badge = "🌟 GOLDEN OFFER + SIGN-ON BONUS";
        desc = "คุณผสมผสานทั้ง Hard Skills ระดับเซียน และ Soft Skills มนุษยสัมพันธ์ยอดเยี่ยม ทุกคนในองค์กรแย่งตัวคุณเข้าทีม!";
        toneColor = "text-yellow-600 dark:text-yellow-300";
      } else if (s.karma >= 75) {
        title = "เจ้าพ่อคอนเนกชัน ตัวเชื่อมทุกแผนก";
        badge = "🤝 CULTURE CHAMPION";
        desc = "ใครๆ ก็รักคุณ แม้โค้ดจะมีบั๊กบ้างแต่คุณประสานงานและแก้สถานการณ์ได้เนียนกริบ ได้รับการทาบทามไปเป็น Product Manager หรือ Scrum Master!";
        toneColor = "text-emerald-700 dark:text-emerald-400";
      } else if (s.skill >= 60) {
        title = "ผ่านเกณฑ์สหกิจศึกษาตามมาตรฐาน";
        badge = "📜 PASS WITH CERTIFICATE";
        desc = "คุณทำหน้าที่ของตนเองได้ครบถ้วน ส่งมอบงานตรงเวลา ได้เกรด A ในวิชาสหกิจศึกษา และพร้อมสำหรับตลาดแรงงานสากล!";
        toneColor = "text-sky-700 dark:text-sky-400";
      } else {
        title = "เอาตัวรอดมาได้แบบเฉียดฉิว";
        badge = "🛡️ SURVIVOR";
        desc = "16 สัปดาห์แห่งความปั่นป่วน คุณผ่านการประเมินแบบพอดีเกณฑ์ ได้เรียนรู้บทเรียนชีวิตจริงที่มีค่ามากกว่าในตำราเรียน!";
        toneColor = "text-slate-700 dark:text-slate-300";
      }

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
          
          <!-- LEFT COLUMN: Trophy Viewport -->
          <div class="lg:col-span-6 flex flex-col justify-between">
            <div class="gold-box rounded-lg overflow-hidden bg-[#051124] relative aspect-[16/9] w-full flex items-center justify-center shadow-md">
              ${SCENE_ARTS.trophy}
              
              <div class="absolute top-3 left-3 bg-slate-900/90 border border-amber-400 px-3 py-1 rounded text-xs font-bold font-mono text-amber-300">
                ${badge}
              </div>
            </div>

            <!-- Stat Summary Grid -->
            <div class="mt-3 grid grid-cols-5 gap-1.5 text-center text-xs font-mono bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 p-2.5 rounded-lg">
              <div class="p-1 bg-white dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800">
                <div class="text-red-500 font-bold">❤️ สุขภาพ</div>
                <div class="text-slate-800 dark:text-slate-200 font-bold mt-0.5">${Math.max(0, s.energy)}</div>
              </div>
              <div class="p-1 bg-white dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800">
                <div class="text-amber-500 font-bold">😊 สติ</div>
                <div class="text-slate-800 dark:text-slate-200 font-bold mt-0.5">${Math.max(0, s.sanity)}</div>
              </div>
              <div class="p-1 bg-white dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800">
                <div class="text-sky-500 font-bold">📘 ทักษะ</div>
                <div class="text-slate-800 dark:text-slate-200 font-bold mt-0.5">${Math.max(0, s.skill)}</div>
              </div>
              <div class="p-1 bg-white dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800">
                <div class="text-emerald-600 font-bold">👔 บารมี</div>
                <div class="text-slate-800 dark:text-slate-200 font-bold mt-0.5">${Math.max(0, s.karma)}</div>
              </div>
              <div class="p-1 bg-white dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800">
                <div class="text-yellow-600 font-bold">💰 เงินเก็บ</div>
                <div class="text-yellow-800 dark:text-yellow-300 font-bold mt-0.5">฿${s.money.toLocaleString()}</div>
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN: Evaluation Narrative & Restart Button -->
          <div class="lg:col-span-6 flex flex-col justify-between space-y-4">
            <div>
              <div class="text-xs font-mono text-amber-700 dark:text-amber-400 tracking-wider mb-1 font-bold">
                ผลสรุปสหกิจศึกษา 16 สัปดาห์ (4 เดือนเต็ม)
              </div>
              <h2 class="text-xl sm:text-2xl font-extrabold ${toneColor} leading-tight">
                ${title}
              </h2>
              <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                ตำแหน่ง: <strong>${roleObj.title}</strong> · บริษัท: <strong>${comp.name}</strong>
              </div>

              <div class="border-l-4 border-amber-500 bg-amber-50/70 dark:bg-slate-900/80 p-3.5 rounded-r text-xs sm:text-sm text-slate-800 dark:text-slate-200 mt-3 leading-relaxed font-medium">
                ${desc}
              </div>
            </div>

            <div class="bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 p-3 rounded-lg text-xs text-slate-600 dark:text-slate-400 italic">
              "ชีวิตการฝึกงานอาจเต็มไปด้วยความไม่แน่นอนและบั๊กที่คาดไม่ถึง แต่ประสบการณ์ที่คุณสะสมมาคือจุดเริ่มต้นของวิศวกรซอฟต์แวร์ตัวจริง"
            </div>

            <div>
              <button onclick="restartGame()" class="w-full py-3.5 gold-btn rounded-xl text-base font-bold flex items-center justify-center gap-2 shadow-md">
                <span>ลองเกิดใหม่ในสายงานอื่น (กด Enter)</span>
                <span class="font-mono text-xs opacity-80 bg-black/10 px-1.5 py-0.5 rounded">↵</span>
              </button>
            </div>
          </div>

        </div>
      `;
    }

    // --- LOGIC HANDLERS ---
    function selectRole(roleId) {
      if (ROLES[roleId]) {
        gameState.selectedRole = roleId;
        playSound('select');
        render();
      }
    }

    function startGame() {
      playSound('click');
      const randomComp = COMPANIES[Math.floor(Math.random() * COMPANIES.length)];
      gameState.company = randomComp;

      const baseRole = ROLES[gameState.selectedRole].init;
      gameState.stats = {
        skill: baseRole.skill + (randomComp.bonus.skill || 0),
        energy: baseRole.energy + (randomComp.bonus.energy || 0),
        sanity: baseRole.sanity + (randomComp.bonus.sanity || 0),
        karma: baseRole.karma + (randomComp.bonus.karma || 0),
        money: randomComp.bonus.money || 3000
      };

      gameState.week = 1;
      gameState.screen = 'event';
      gameState.lastToast = `สุ่มได้: ${randomComp.name.split(' ')[0]}`;
      playSound('success');
      render();
    }

    function makeChoice(idx) {
      playSound('click');
      const choices = getChoicesForWeek(gameState.selectedRole, gameState.week);
      const choice = choices[idx] || choices[0];

      const s = gameState.stats;
      s.skill += choice.stats.skill || 0;
      s.energy += choice.stats.energy || 0;
      s.sanity += choice.stats.sanity || 0;
      s.karma += choice.stats.karma || 0;
      s.money += (choice.stats.money || 0) + (gameState.company ? gameState.company.dailyStipend * 5 : 3000);

      s.energy = Math.max(0, Math.min(100, s.energy));
      s.sanity = Math.max(0, Math.min(100, s.sanity));
      s.skill = Math.max(0, s.skill);

      const skillDelta = choice.stats.skill > 0 ? `+${choice.stats.skill} 📘` : `${choice.stats.skill} 📘`;
      const energyDelta = choice.stats.energy > 0 ? `+${choice.stats.energy} ❤️` : `${choice.stats.energy} ❤️`;
      gameState.lastToast = `${skillDelta} · ${energyDelta} · +เบี้ยเลี้ยงสัปดาห์`;
      gameState.lastFeedback = choice.feedback;

      gameState.screen = 'feedback';
      render();
    }

    function nextWeek() {
      playSound('click');
      if (gameState.week >= TOTAL_WEEKS || gameState.stats.energy <= 0 || gameState.stats.sanity <= 0) {
        gameState.screen = 'ending';
        playSound('success');
      } else {
        gameState.week += 1;
        gameState.screen = 'event';
        gameState.lastToast = null;
      }
      render();
    }

    function restartGame() {
      playSound('click');
      gameState = {
        screen: 'start',
        selectedRole: 'dev',
        company: null,
        week: 1,
        stats: {
          skill: 35,
          energy: 85,
          sanity: 75,
          karma: 35,
          money: 3000
        },
        lastToast: null,
        historyLog: []
      };
      render();
    }

    // --- KEYBOARD LISTENER ---
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') {
        if (gameState.screen === 'event') makeChoice(0);
      } else if (e.key === '2') {
        if (gameState.screen === 'event') makeChoice(1);
      } else if (e.key === '3') {
        if (gameState.screen === 'event') makeChoice(2);
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (gameState.screen === 'start') {
          startGame();
        } else if (gameState.screen === 'feedback') {
          nextWeek();
        } else if (gameState.screen === 'ending') {
          restartGame();
        }
      }
    });

    // Initialize
    initTheme();
    render();
  </script>
</body>
</html>
