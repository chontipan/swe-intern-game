    // --- AUDIO SYNTH ENGINE ---
    let audioCtx = null;
    let isMuted = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleAudio() {
      isMuted = !isMuted;
      const btn = document.getElementById('btnAudioToggle');
      if (btn) btn.innerText = isMuted ? '♪ เปิดเพลง' : '♪ ปิดเพลง';
      if (!isMuted) playSound('click');
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(880, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'select') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.12);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(554.37, now + 0.08);
          osc.frequency.setValueAtTime(659.25, now + 0.16);
          osc.frequency.setValueAtTime(880, now + 0.24);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'fail') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.setValueAtTime(200, now + 0.12);
          osc.frequency.setValueAtTime(140, now + 0.24);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'warning') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(180, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'money') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

        endingArt = SCENE_ARTS.job_offer;
        careerBanner = `<div class="bg-cyan-950/50 border border-cyan-500/50 p-2.5 rounded text-xs text-cyan-300 font-mono">💻 ชะตากรรม: ทำงาน Remote พาร์ตไทม์ควบเรียนปี 4 รับเงินเดือนสบายๆ</div>`;
      } else if (gameState.careerChoice === 'bigtech') {
        title = "ทะยานสู่ Big Tech ระดับโลก";
        badge = "🌍 GLOBAL TECH HUNTER";
        desc = `ด้วยความมั่นใจและพอร์ตโฟลิโออันยอดเยี่ยมตลอด 16 สัปดาห์ คุณนำประสบการณ์จริงไปยื่นสอบสัมภาษณ์กับ Tech ยักษ์ใหญ่ระดับนานาชาติ และได้รับการตอบรับเข้าทำงานด้วยเงินเดือนระดับท็อปของประเทศ!`;
        toneColor = "text-purple-400";
        endingArt = SCENE_ARTS.trophy;
        careerBanner = `<div class="bg-purple-950/50 border border-purple-500/50 p-2.5 rounded text-xs text-purple-300 font-mono">🌟 ชะตากรรม: ทะยานสู่ Tech ยักษ์ใหญ่ระดับนานาชาติ</div>`;
      } else if (gameState.careerChoice === 'rest') {
        title = "ผู้พิชิตสหกิจศึกษา & พักผ่อนฮีลใจ";
        badge = "🌿 MINDFUL GRADUATE";
        desc = `คุณเลือกให้คุณค่ากับชีวิตและสุขภาพ ปิดฉากการฝึกงานด้วยเกรด A เต็ม แล้วกลับไปใช้ชีวิตวัยนักศึกษาเทอมสุดท้าย ทำธีสิส นอนกอดแมว และเดินทางท่องเที่ยวชาร์จพลังจนเต็มเปี่ยม`;
        toneColor = "text-emerald-400";
        endingArt = SCENE_ARTS.trophy;
        careerBanner = `<div class="bg-teal-950/50 border border-teal-500/50 p-2.5 rounded text-xs text-teal-300 font-mono">☕ ชะตากรรม: ปริญญาพร้อม สุขภาพกายใจฟื้นฟูเต็ม 100</div>`;
      }

      // Special check: SENT BACK TO UNIVERSITY (F)
      if (gameState.isSentBack) {
        title = "โดนส่งตัวกลับมหาวิทยาลัย! (ติด F สหกิจศึกษา)";
        badge = "❌ TERMINATED & SENT BACK";
        desc = gameState.sentBackReason || "บริษัทได้ส่งหนังสือแจ้งอาจารย์ที่ปรึกษาขอยกเลิกสัญญาฝึกงานและส่งตัวคุณกลับมหาวิทยาลัยก่อนกำหนด เนื่องจากปัญหาทางวินัยหรือสร้างความเสียหายร้ายแรง... ต้องลงทะเบียนวิชาสหกิจศึกษาเรียนซ้ำใหม่เทอมหน้า!";
        toneColor = "text-red-500";
        endingArt = SCENE_ARTS.sent_back;
      } else if (s.energy <= 0) {
        title = "ป่วยหนักจนต้องถอนตัว (ส่งตัวกลับรักษาตัว)";
        badge = "🏥 MEDICAL WITHDRAWAL";
        desc = "ร่างกายประท้วงจากการอดหลับอดนอนสะสม แพทย์สั่งให้พักรักษาตัวอย่างเด็ดขาด บริษัทจึงทำเรื่องส่งตัวกลับมหาวิทยาลัยเพื่อรักษาตัว สุขภาพกายต้องมาก่อนงานเสมอ!";
        toneColor = "text-red-400";
        endingArt = SCENE_ARTS.sent_back;
      } else if (s.sanity <= 0) {
        title = "Burnout สติหลุด ขอยุติการฝึกงาน";
        badge = "💀 BURNOUT RESIGNATION";
        desc = "ความกดดันสะสมจนสภาพจิตใจแบกรับไม่ไหว เกิดอาการหมดไฟขั้นรุนแรง ตัดสินใจขอยุติการฝึกงานเพื่อกลับไปฟื้นฟูสภาพจิตใจ";
        toneColor = "text-amber-400";
        endingArt = SCENE_ARTS.sent_back;
      } else if (s.karma <= 0) {
        title = "โดนส่งตัวกลับเนื่องจากพ้นสภาพความไว้ใจ";
        badge = "🚫 DISCIPLINARY DISMISSAL";
        desc = "คะแนนบารมีความประพฤติติดลบ พี่เลี้ยงและผู้จัดการลงความเห็นว่าขาดความรับผิดชอบอย่างต่อเนื่อง จึงทำหนังสือแจ้งคณะวิศวกรรมศาสตร์เพื่อส่งตัวกลับทันที!";
        toneColor = "text-red-500";
        endingArt = SCENE_ARTS.sent_back;
      } else if (s.money < -5000) {
        title = "ผ่านการฝึกงานแต่มีหนี้สินล้นพ้นตัว";
        badge = "💸 IN DEBT SURVIVOR";
        desc = `คุณเอาตัวรอดจนจบ 16 สัปดาห์ได้ แต่เบี้ยเลี้ยงไม่พอกับค่าครองชีพในกรุงเทพฯ คุณติดหนี้สะสม ฿${Math.abs(s.money).toLocaleString()} ต้องรีบหางานประจำเพื่อปลดหนี้ก้อนโต!`;
        toneColor = "text-amber-300";
      } else if (s.skill >= 75 && s.karma >= 60) {
        title = "ว่าที่ Tech Lead ดาวรุ่งคนใหม่";
        badge = "🌟 GOLDEN OFFER + SIGN-ON BONUS";
        desc = "คุณผสมผสานทั้ง Hard Skills ระดับเซียน และ Soft Skills มนุษยสัมพันธ์ยอดเยี่ยม ทุกคนในองค์กรแย่งตัวคุณเข้าทีม พร้อมฉลองเหมาเตาหมูกระทะทั้งแผนก!";
        toneColor = "text-[#ffd600]";
      } else if (s.karma >= 75) {
        title = "เจ้าพ่อคอนเนกชัน ตัวเชื่อมทุกแผนก";
        badge = "🤝 CULTURE CHAMPION";
        desc = "ใครๆ ก็รักคุณ แม้โค้ดจะมีบั๊กบ้างแต่คุณประสานงานและแก้สถานการณ์ได้เนียนกริบ ได้รับการทาบทามไปเป็น Product Manager หรือ Scrum Master!";
        toneColor = "text-[#26a69a]";
      } else if (s.skill >= 60) {
        title = "ผ่านเกณฑ์สหกิจศึกษาตามมาตรฐาน";
        badge = "📜 PASS WITH CERTIFICATE";
        desc = "คุณทำหน้าที่ของตนเองได้ครบถ้วน ส่งมอบงานตรงเวลา ได้เกรด A ในวิชาสหกิจศึกษา และพร้อมสำหรับตลาดแรงงานสากล!";
        toneColor = "text-[#00e5ff]";
      } else {
        title = "เอาตัวรอดมาได้แบบเฉียดฉิว";
        badge = "🛡️ SURVIVOR";
        desc = "16 สัปดาห์แห่งความปั่นป่วน คุณผ่านการประเมินแบบพอดีเกณฑ์ ได้เรียนรู้บทเรียนชีวิตจริงที่มีค่ามากกว่าในตำราเรียน!";
        toneColor = "text-slate-200";
      }

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
          
          <!-- LEFT COLUMN: Ending Viewport (Trophy or Sent Back) -->
          <div class="lg:col-span-6 flex flex-col justify-between">
            <div class="gold-box rounded-lg overflow-hidden bg-[#051124] relative aspect-[16/9] w-full flex items-center justify-center shadow-lg">
              ${endingArt}
              
              <div class="absolute top-3 left-3 bg-[#0d1736]/90 border border-[#dfbd69] px-3 py-1 rounded text-xs font-bold font-mono text-[#dfbd69]">
                ${badge}
              </div>
            </div>

            <!-- Stat Summary Grid -->
            <div class="mt-3 grid grid-cols-5 gap-1.5 text-center text-xs font-mono bg-[#0c1633] border border-[#16234d] p-2.5 rounded-lg">
              <div class="p-1 bg-[#0f1a3a] rounded border border-[#1a2c5a]">
                <div class="text-red-400 font-bold">❤️ สุขภาพ</div>
                <div class="text-slate-100 font-bold mt-0.5">${Math.max(0, s.energy)}</div>
              </div>
              <div class="p-1 bg-[#0f1a3a] rounded border border-[#1a2c5a]">
                <div class="text-[#ffd600] font-bold">😊 ความสุข</div>
                <div class="text-slate-100 font-bold mt-0.5">${Math.max(0, s.sanity)}</div>
              </div>
              <div class="p-1 bg-[#0f1a3a] rounded border border-[#1a2c5a]">
                <div class="text-[#00e5ff] font-bold">📘 ทักษะ</div>
                <div class="text-slate-100 font-bold mt-0.5">${Math.max(0, s.skill)}</div>
              </div>
              <div class="p-1 bg-[#0f1a3a] rounded border border-[#1a2c5a]">
                <div class="text-[#26a69a] font-bold">👔 บารมี</div>
                <div class="text-slate-100 font-bold mt-0.5">${Math.max(0, s.karma)}</div>
              </div>
              <div class="p-1 bg-[#0f1a3a] rounded border border-[#1a2c5a]">
                <div class="text-[#fbc02d] font-bold">💰 เงิน</div>
                <div class="text-slate-100 font-bold mt-0.5">${s.money < 0 ? `-${Math.abs(s.money)}` : `฿${s.money.toLocaleString()}`}</div>
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN: Evaluation Narrative & Restart Button -->
          <div class="lg:col-span-6 flex flex-col justify-between space-y-4">
            <div>
              <div class="text-xs font-mono text-[#dfbd69] tracking-wider mb-1 font-bold">
                ${gameState.isSentBack || s.energy <= 0 || s.sanity <= 0 || s.karma <= 0 ? 'สิ้นสุดการฝึกงานก่อนกำหนด (FAIL)' : 'ผลสรุปสหกิจศึกษา 16 สัปดาห์ (4 เดือนเต็ม)'}
              </div>
              <h2 class="text-xl sm:text-2xl font-extrabold ${toneColor} leading-tight">
                ${title}
              </h2>
              <div class="text-xs text-slate-400 mt-1">
                ตำแหน่ง: <strong>${roleObj.title}</strong> · บริษัท: <strong>${comp.name}</strong>
              </div>

              <div class="border-l-4 border-[#e5a83b] bg-[#0c1633] p-3.5 rounded-r text-xs sm:text-sm text-slate-200 mt-3 leading-relaxed font-medium">
                ${desc}
              </div>
              ${careerBanner ? `<div class="mt-2.5">${careerBanner}</div>` : ""}
            </div>

            <div class="bg-[#0c1633] border border-[#16234d] p-3 rounded-lg text-xs text-slate-400 italic">
              ${gameState.isSentBack ? '"การล้มเหลวในครั้งนี้คือบทเรียนสำคัญ อย่าเพิ่งท้อถอย กลับไปตั้งหลักที่มหาวิทยาลัยแล้วพัฒนาตนเองเพื่อกลับมาใหม่!"' : '"ชีวิตการฝึกงานอาจเต็มไปด้วยความไม่แน่นอนและบั๊กที่คาดไม่ถึง แต่ประสบการณ์ที่คุณสะสมมาคือจุดเริ่มต้นของวิศวกรซอฟต์แวร์ตัวจริง"'}
            </div>

            <div>
              <button onclick="restartGame()" class="w-full py-3.5 btn-gold-65m text-base font-bold flex items-center justify-center gap-2 shadow-lg">
                <span>ลองเกิดใหม่ในสายงานอื่น (กด Enter)</span>
                <span class="font-mono text-xs opacity-80 bg-black/10 px-1.5 py-0.5 rounded">↵</span>
              </button>
            </div>
          </div>

        </div>
      `;
    }

    // --- LOGIC HANDLERS ---
    function selectRole(roleId) {
      if (ROLES[roleId]) {
        gameState.selectedRole = roleId;
        playSound('select');
        render();
      }
    }

    function startGame() {
      playSound('click');
      const randomComp = COMPANIES[Math.floor(Math.random() * COMPANIES.length)];
      gameState.company = randomComp;

      const baseRole = ROLES[gameState.selectedRole].init;
      gameState.stats = {
        skill: baseRole.skill + (randomComp.bonus.skill || 0),
        energy: baseRole.energy + (randomComp.bonus.energy || 0),
        sanity: baseRole.sanity + (randomComp.bonus.sanity || 0),
        karma: baseRole.karma + (randomComp.bonus.karma || 0),
        money: baseRole.money + (randomComp.bonus.money || 0)
      };

      gameState.week = 1;
      gameState.screen = 'event';
      gameState.isSentBack = false;
      gameState.sentBackReason = "";
      gameState.weeklyFinancialReport = null;
      gameState.lastToast = `สุ่มได้: ${randomComp.name.split(' ')[0]}`;
      playSound('success');
      render();
    }

    function makeChoice(idx) {
      playSound('click');
      const roleId = gameState.selectedRole;
      const scenarios = ROLE_SCENARIOS[roleId] || ROLE_SCENARIOS.dev;
      const evIndex = Math.min(gameState.week - 1, scenarios.length - 1);
      const ev = scenarios[evIndex] || scenarios[0];
      const choices = ev.choices;
      const choice = choices[idx] || choices[0];

      const s = gameState.stats;
      const comp = gameState.company || COMPANIES[0];

      // 1. Calculate Real Financial Cashflow for the week
      const stipend = comp.dailyStipend * 5; // 5 working days
      const livingCost = comp.weeklyLivingCost;
      const extraCost = choice.cost || 0;
      
      // Monthly rent every 4 weeks (Week 4, 8, 12, 16)
      const isEndOfWeekMonth = (gameState.week % 4 === 0);
      const rentCost = isEndOfWeekMonth ? comp.monthlyRent : 0;

      const netMoneyDelta = stipend - livingCost + extraCost - rentCost;
      s.money += netMoneyDelta;

      // 2. Apply Stat Impacts from Choice
      s.skill += choice.stats.skill || 0;
      s.energy += choice.stats.energy || 0;
      s.sanity += choice.stats.sanity || 0;
      s.karma += choice.stats.karma || 0;

      // 3. Interdependent Health & Financial Factors
      if (s.money < 0) {
        // Financial stress penalty
        s.sanity -= 6;
        s.energy -= 4;
      }
      if (s.energy < 30) {
        // Brain fatigue penalty
        s.skill = Math.max(0, s.skill - 3);
      }
      if (s.sanity < 30) {
        // Imposter syndrome penalty
        s.energy -= 4;
      }

      s.energy = Math.min(100, s.energy);
      s.sanity = Math.min(100, s.sanity);

      // 4. Save Financial Breakdown Report
      gameState.weeklyFinancialReport = {
        stipend,
        livingCost,
        extraCost,
        rentCost,
        netMoneyDelta
      };

      // 5. Check Critical Failure: SENT BACK TO UNIVERSITY (Terminated / F)
      if (gameState.week === 8 && idx === 2 && s.karma <= 20) {
        gameState.isSentBack = true;
        gameState.sentBackReason = "วิกฤตสัปดาห์ที่ 8: คุณพยายามตีเนียนปกปิดความผิดพลาดร้ายแรงและทำลายหลักฐาน! ทางบริษัทลงมติว่าเป็นการทำผิดวินัยขั้นร้ายแรง จึงส่งหนังสือแจ้งอาจารย์ที่ปรึกษาขอยกเลิกการฝึกงานและส่งตัวคุณกลับมหาวิทยาลัยทันที ติด F สหกิจศึกษา!";
        playSound('fail');
      } else if (s.energy <= 0 || s.sanity <= 0 || s.karma <= 0) {
        gameState.isSentBack = true;
        if (s.karma <= 0) {
          gameState.sentBackReason = "คะแนนบารมีความประพฤติติดลบ! พี่เลี้ยงและทีมงานลงความเห็นว่าขาดความรับผิดชอบอย่างต่อเนื่อง จึงทำเรื่องส่งตัวคุณกลับมหาวิทยาลัย";
        } else if (s.energy <= 0) {
          gameState.sentBackReason = "พลังกายลดลงเหลือ 0 ล้มป่วยหนักจากการอดนอนสะสมจนไม่สามารถฝึกงานต่อได้ บริษัทจึงส่งตัวกลับมหาวิทยาลัยเพื่อรักษาตัว";
        } else {
          gameState.sentBackReason = "ค่าความสุขลดลงเหลือ 0 เกิดภาวะ Burnout รุนแรงจนไม่สามารถปฏิบัติงานต่อได้ ขอยุติการฝึกงานและกลับมหาวิทยาลัย";
        }
        playSound('fail');
      } else {
        if (extraCost < 0) playSound('money');
      }

      const skillDelta = (choice.stats.skill || 0) > 0 ? `+${choice.stats.skill} 📘` : `${choice.stats.skill || 0} 📘`;
      const moneyText = netMoneyDelta >= 0 ? `+฿${netMoneyDelta}` : `-฿${Math.abs(netMoneyDelta)}`;
      gameState.lastToast = `${skillDelta} · ${moneyText} สัปดาห์นี้`;
      gameState.lastFeedback = choice.feedback;

      gameState.screen = 'feedback';
      render();
    }

    function nextWeek() {
      playSound('click');
      const s = gameState.stats;
      const isFailed = gameState.isSentBack || s.energy <= 0 || s.sanity <= 0 || s.karma <= 0;

      if (isFailed) {
        gameState.screen = 'ending';
        playSound('fail');
      } else if (gameState.week >= TOTAL_WEEKS) {
        // Check if student qualified to be INVITED to work! (โดนชวนให้ทำงานต่อ)
        if (s.skill >= 45 || s.karma >= 45) {
          gameState.hasJobOffer = true;
          gameState.screen = 'job_offer';
          playSound('success');
        } else {
          gameState.screen = 'ending';
          playSound('success');
        }
      } else {
        gameState.week += 1;
        gameState.screen = 'event';
        gameState.lastToast = null;
        gameState.weeklyFinancialReport = null;
      }
      render();
    }

    function restartGame() {
      playSound('click');
      gameState = {
        screen: 'start',
        selectedRole: 'dev',
        company: null,
        week: 1,
        stats: {
          skill: 35,
          energy: 85,
          sanity: 75,
          karma: 40,
          money: 4000
        },
        lastToast: null,
        lastFeedback: "",
        weeklyFinancialReport: null,
        isSentBack: false,
        sentBackReason: ""
      };
      render();
    }

    // --- KEYBOARD LISTENER (Exact 1-in-65M Controls) ---
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') {
        if (gameState.screen === 'event') makeChoice(0);
        else if (gameState.screen === 'job_offer') selectCareerChoice('fulltime');
      } else if (e.key === '2') {
        if (gameState.screen === 'event') makeChoice(1);
        else if (gameState.screen === 'job_offer') selectCareerChoice('parttime');
      } else if (e.key === '3') {
        if (gameState.screen === 'event') makeChoice(2);
        else if (gameState.screen === 'job_offer') selectCareerChoice('bigtech');
      } else if (e.key === '4') {
        if (gameState.screen === 'job_offer') selectCareerChoice('rest');
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (gameState.screen === 'start') {
          startGame();
        } else if (gameState.screen === 'feedback') {
          nextWeek();
        } else if (gameState.screen === 'ending') {
          restartGame();
        }
      }
    });

    render();
  </script>
</body>
</html>
